staticman:
  allowedFields: ['name', 'email', 'url', 'message']
  branch: "gh-pages"
  commitMessage: "New comment."
  filename: comment-{@timestamp}
  format: "yml"
  moderation: true
  path: "_data/comments/{options.slug}"
  requiredFields: ['name', 'email', 'message']
  transforms:
    email: "md5"
  generatedFields:
    date:
      type: "date"
      options:
        format: "iso8601"
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  ignore:
    envs: development
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - package.json*
